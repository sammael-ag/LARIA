name: LARIA v2 Deployer

on:
  push:
    branches:
      - main

permissions:
  contents: read     # Stačí nám čítať kód
  pages: write       # Zápis priamo na GitHub Pages server
  id-token: write    # Overenie identity pre laria.space

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22' # 🔥 Budúcnosť je tu: Aktualizované na stabilné Node 22 LTS
          cache: 'npm'

      - name: Install dependencies
        run: |
          npm install --legacy-peer-deps

      - name: Build Web App (Expo + Metro Export)
        run: npm run build:web

      - name: Upload Artifact to Pages
        uses: actions/upload-pages-artifact@v3
        with:
          name: laria-v2-web-build  # 🪓 UNIKÁTNE MENO: Koniec duplicitným strašidlám na GitHub serveri
          path: ./dist # Sem smerujeme vygenerovaný web, ktorý sa bezpečne zabalí

      - name: Deploy to GitHub Pages Natívne
        uses: actions/deploy-pages@v4 # Oficiálna akcia od GitHubu, žiadna tretia strana
        with:
          artifact_name: laria-v2-web-build # 📡 PRESNÉ LÍCOVANIE: Sťahujeme presne ten balík, ktorý sme hore vyrobili