name: LARIA v2 Deployer

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pages: write      # 🔥 PRIDANÉ: Nové prísne pravidlá GitHubu vyžadujú povolenie na zápis stránok
  id-token: write   # 🔥 PRIDANÉ: Potrebné pre bezpečné overenie OIDC tokenu v novom Node prostredí

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4 # 🚀 MODERNIZÁCIA: Prechod na v4, ktorá natívne miluje nové Node prostredie

      - name: Setup Node.js
        uses: actions/setup-node@v4 # 🚀 MODERNIZÁCIA: Prechod na v4 pre stabilné cachovanie
        with:
          node-version: '20' # 📈 UPGRADE: Zdvihla som to na stabilnú '20' (Expo 51 aj krypto knižnice na nej idú ako hodinky a GitHub ju nešikanuje)
          cache: 'npm'

      - name: Install dependencies
        run: |
          npm install --legacy-peer-deps

      - name: Build Web App (Expo + Metro Export)
        run: npm run build:web

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4.7.2 # 🚀 FIX: Vytiahla som verziu na najnovšiu desatinnú čiarku (v4.7.2 plne rieši zamŕzanie zápisu CNAME pod Node 24)
        with:
          folder: ./dist
          branch: gh-pages
          clean: true