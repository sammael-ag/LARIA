name: LARIA v2 Deployer

on:
  push:
    branches:
      - main

permissions:
  contents: read     # Stačí nám čítať kód
  pages: write       # Zápis priamo na GitHub Pages server
  id-token: write    # Overenie identity pre laria.space

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24' # 🚀 Prepnuté na čisté Node 24 podľa najnovšieho štandardu GitHubu
          cache: 'npm'

      - name: Install dependencies
        run: |
          npm install --legacy-peer-deps

      - name: Build Web App (Expo + Metro Export)
        run: npm run build:web

      - name: Upload Artifact to Pages
        uses: actions/upload-pages-artifact@v4 # 🔥 UPGRADE na v4 (plná integrácia s Node 24 bez deprecation)
        with:
          name: laria-v2-web-build
          path: ./dist

      - name: Deploy to GitHub Pages Natívne
        uses: actions/deploy-pages@v4 # Oficiálna najnovšia akcia
        with:
          artifact_name: laria-v2-web-build