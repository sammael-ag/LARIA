name: LARIA v2 Deployer

on:
  push:
    branches:
      - legacy-full

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Check out repository
        uses: actions/checkout@v3

      - name: 🏗️ Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm install --legacy-peer-deps

      - name: 🛠️ Build PWA (Expo Web)
        run: npx expo export --platform web --output-dir dist

      - name: 📂 The "Master Move" (Reorganize for GitHub)
        # Tu robíme ten poriadok s fúrikom
        run: |
          # Vytvoríme záložnú kópiu všetkého do priečinka LARIA vnútri dist
          mkdir -p dist/LARIA
          cp -r dist/_expo dist/LARIA/ 2>/dev/null || true
          cp dist/index.html dist/LARIA/index.html 2>/dev/null || true
          cp dist/manifest.json dist/LARIA/manifest.json 2>/dev/null || true
          # Poistka proti Jekyllu
          touch dist/.nojekyll
          touch dist/LARIA/.nojekyll

      - name: 🚀 Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist
          branch: gh-pages
          clean: true
          clean-exclude: |
            .nojekyll