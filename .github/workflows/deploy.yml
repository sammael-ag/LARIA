name: LARIA v2 Deployer

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18
          cache: 'npm'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build PWA Expo Web
        run: NODE_ENV=production npx expo export --platform web

      - name: SED FIX Oprava ciest pre GitHub Pages
        run: sed -i 's|"/_expo/|"/LARIA/_expo/|g' dist/index.html && sed -i 's|"_expo/|"LARIA/_expo/|g' dist/index.html

      - name: Fix GitHub Jekyll Issue
        run: touch dist/.nojekyll

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist
          branch: gh-pages
          clean: true
          clean-exclude: |
            .nojekyll
