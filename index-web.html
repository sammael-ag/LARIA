<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LARIA - Sieť Majstrov</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" type="image/png" href="assets/laria-seal.png">
    <link rel="apple-touch-icon" href="assets/laria-seal.png">
</head>
<body class="bg-dashboard">
    
    <header class="header"> 
        <h1 class="header-title">LARIA // MATRIX</h1> 
        <div id="status-light" class="status-indicator" style="background: #333;"></div>
    </header>

    <main class="scroll-content">
        <div class="filter-container">
            <select id="categorySelect" class="terminal-input" onchange="setCategory(this.value)">
                <option value="vsetko">Všetky kategórie</option>
                <option value="obziva">Obživa a poživatiny</option>
                <option value="remesla">Remeslá a materiál</option>
                <option value="sluzby">Odborné služby</option>
                <option value="vzdelavanie">Vzdelávanie a rozvoj</option>
                <option value="knihy">Knihy</option>
                <option value="zdravie">Zdravie a zdravotnícke pomôcky</option>
                <option value="oblecenie">Oblečenie a doplnky</option>
                <option value="auto">Auto-moto</option>
                <option value="volno">Zážitkové aktivity a voľný čas</option>
                <option value="elektro">Elektro - čierna/biela technika</option>
                <option value="rodina">Deti a rodina</option>
                <option value="ubytovanie">Ubytovanie a prenájom</option>
                <option value="zahrada">Záhrada a gazdovstvo</option>
                <option value="nabytok">Nábytok a zariadenie domácnosti</option>
                <option value="kultura">Kultúra a umenie</option>
                <option value="osobne">Osobné služby</option>
                <option value="tvorba">Ručné práce a tvorba</option>
                <option value="ine">Iné</option>
            </select>

            <input type="text" id="searchInput" class="terminal-input" 
                   oninput="applyFilter()" placeholder="🔍 Hľadať v systéme...">
        </div>

        <div id="cards-container" class="laria-grid">
            <p class="text-cyber" style="color: #b19cd9; text-align: center; width: 100%;">[ NAČÍTAVAM ČAKRY SYSTÉMU... ]</p>
        </div>
    </main>

    <button onclick="window.scrollTo({top: 0, behavior: 'smooth'})" id="backToTop" class="irc-button" style="position: fixed; bottom: 20px; right: 20px; width: 50px; height: 50px; display: none; background: #b19cd9; color: #000; border: none; border-radius: 50%; cursor: pointer; z-index: 99;">↑</button>

    <script src="index-web.js"></script>

    <div id="lariaBridge" class="modal-overlay" style="display: none;">
        <div class="modal-content">
            <div class="modal-header">
                <span class="tag" style="color: #b19cd9;">[ LARIA_DISTRIBUTION_PROTOCOL ]</span>
                <button class="modal-close" onclick="closeLariaBridge()" style="background: none; border: none; color: #fff; font-size: 24px; cursor: pointer;">×</button>
            </div>
            
            <h3 class="modal-title" style="color: #fff; margin-top: 10px;">ZVOLIŤ CIEĽOVÚ STANICU</h3>
            <p class="modal-subtitle" style="color: #666; font-size: 0.9em; margin-bottom: 20px;">Pre uloženie vizitky si vyberte spôsob distribúcie:</p>

            <div class="modal-grid">
                <button class="modal-btn main" id="btn-open-app" style="background: #b19cd9; color: #000;">
                    <span class="icon">📱</span>
                    <span class="btn-label">OTVORIŤ V APPKE (LARIA://)</span>
                </button>
                
                <button class="modal-btn" onclick="window.location.href='https://github.com/sammael-ag/LARIA/releases/latest/download/laria.apk'">
                    <span class="icon">🤖</span>
                    <span class="btn-label">ANDROID APP (.APK)</span>
                </button>

                <button class="modal-btn" onclick="alert('iOS verzia v schvaľovaní (TestFlight).')">
                    <span class="icon">🍏</span>
                    <span class="btn-label">APPLE APP</span>
                </button>

                <button class="modal-btn" onclick="window.location.href='https://github.com/sammael-ag/LARIA/releases/latest/download/laria.deb'">
                    <span class="icon">🐧</span>
                    <span class="btn-label">UBUNTU (.DEB)</span>
                </button>

                <button class="modal-btn github" onclick="window.location.href='https://github.com/sammael-ag/LARIA'" style="border-color: #444;">
                    <span class="icon">🐙</span>
                    <span class="btn-label">GITHUB SOURCE</span>
                </button>
            </div>
            
            <div class="modal-footer" style="margin-top: 20px; border-top: 1px solid #222; padding-top: 10px;">
                <span class="text-dim" style="color: #444; font-size: 10px;">PEČAŤ_FING: <span id="modal-fingerprint" style="color: #b19cd9;">---</span></span>
            </div>
        </div>
    </div>
</body>
</html>
